    // ============================================================================
    // 5. CONFIGURACIÓN DE MARKED.JS + HIGHLIGHT.JS + DOMPURIFY
    // ============================================================================
    function configureMarkdownEngine() {
      if (typeof marked === "undefined") return;

      const renderer = new marked.Renderer();
      renderer.code = function (code, infostring) {
        let rawCode = typeof code === "object" ? (code.text || "") : String(code || "");
        let lang = typeof code === "object" ? (code.lang || "") : String(infostring || "");
        lang = lang.trim().split(/\s+/)[0] || "plaintext";

        let highlighted = rawCode;
        if (typeof hljs !== "undefined") {
          try {
            if (lang && hljs.getLanguage(lang)) {
              highlighted = hljs.highlight(rawCode, { language: lang, ignoreIllegals: true }).value;
            } else {
              highlighted = hljs.highlightAuto(rawCode).value;
            }
          } catch (e) {
            highlighted = rawCode;
          }
        }

        const safeLangLabel = lang.toUpperCase();
        const encodedCode = encodeURIComponent(rawCode);

        return `
          <div class="my-3 rounded-xl overflow-hidden border border-slate-700/80 bg-[#090d16]">
            <div class="flex items-center justify-between px-3.5 py-1.5 bg-slate-900/90 border-b border-slate-800 text-[11px] text-slate-400">
              <span class="font-mono font-semibold text-slate-300">${safeLangLabel}</span>
              <button type="button" onclick="copyCodeBlock(this, '${encodedCode}')" class="flex items-center gap-1 px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition text-[10px]">
                <span>Copiar código</span>
              </button>
            </div>
            <pre><code class="hljs language-${lang}">${highlighted}</code></pre>
          </div>
        `;
      };

      marked.setOptions({
        renderer,
        gfm: true,
        breaks: true
      });
    }

    function renderMarkdownHtml(markdownText) {
      if (!markdownText) return "";
      try {
        if (typeof marked !== "undefined") {
          const rawHtml = marked.parse(String(markdownText));
          if (typeof DOMPurify !== "undefined") {
            return DOMPurify.sanitize(rawHtml, {
              ADD_ATTR: ["onclick", "target"]
            });
          }
          return rawHtml;
        }
      } catch (err) {
        console.error("Error renderizando Markdown:", err);
      }
      return String(markdownText).replace(/\n/g, "<br>");
    }

    window.copyCodeBlock = function (btnEl, encodedCode) {
      try {
        const decoded = decodeURIComponent(encodedCode);
        const tempArea = document.createElement("textarea");
        tempArea.value = decoded;
        document.body.appendChild(tempArea);
        tempArea.select();
        document.execCommand("copy");
        document.body.removeChild(tempArea);

        const originalHtml = btnEl.innerHTML;
        btnEl.innerHTML = "<span class='text-emerald-400 font-semibold'>¡Copiado!</span>";
        setTimeout(() => {
          btnEl.innerHTML = originalHtml;
        }, 1800);
      } catch (e) {
        showToast("No se pudo copiar el bloque de código", "error");
      }
    };

    function showToast(message, type = "success") {
      const root = document.getElementById("toast-root");
      if (!root) return;
      const item = document.createElement("div");
      const isErr = type === "error";
      item.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-2xl border text-xs sm:text-sm font-medium transition-all duration-300 ${

          ? "bg-red-950/95 border-red-500/80 text-red-200"

      `;
      root.appendChild(item);
      if (window.lucide) window.lucide.createIcons();
      setTimeout(() => {

    // Calcula el peso aproximado del historial en bytes
    function getStorageUsageBytes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.CONVERSATIONS) || "[]";
        return new Blob([raw]).size;
      } catch (e) {
        return 0;
      }
    }

    // Recorta automáticamente chats antiguos o mensajes excesivos para nunca saturar localStorage
    function enforceStorageQuotas(convList) {
      if (!Array.isArray(convList)) return [];

      // 1. Limitar el número máximo de mensajes por conversación
      const trimmedMessagesList = convList.map((conv) => {
        const msgs = Array.isArray(conv.messages) ? conv.messages : [];
        const slicedMsgs = msgs.length > STORAGE_LIMITS.MAX_MESSAGES_PER_CHAT
          ? msgs.slice(-STORAGE_LIMITS.MAX_MESSAGES_PER_CHAT)
          : msgs;
        return {
          ...conv,
          messages: slicedMsgs
        };
      });

      // 2. Limitar el máximo de conversaciones por cada uno de los 4 modos
      let finalConvs = [];
      Object.keys(SECTIONS).forEach((secKey) => {
        const secChats = trimmedMessagesList
          .filter((c) => c.section === secKey)
          .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
          .slice(0, STORAGE_LIMITS.MAX_CHATS_PER_SECTION);
        finalConvs = finalConvs.concat(secChats);
      });

      finalConvs.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      // 3. Si el tamaño total aún supera el umbral de seguridad, eliminar los chats más antiguos
      while (finalConvs.length > 4) {
        const serialized = JSON.stringify(finalConvs);
        if (serialized.length * 2 <= STORAGE_LIMITS.MAX_STORAGE_BYTES) break;
        finalConvs.pop();
      }

      return finalConvs;
    }

    function loadLocalData() {
      try {
        const storedTokens = localStorage.getItem(STORAGE_KEYS.TOKENS);
        if (storedTokens === null || isNaN(parseInt(storedTokens, 10))) {
          state.tokens = STORAGE_LIMITS.INITIAL_TOKENS;
          localStorage.setItem(STORAGE_KEYS.TOKENS, String(state.tokens));
        } else {
          state.tokens = Math.max(0, parseInt(storedTokens, 10));
        }

        const storedConvs = localStorage.getItem(STORAGE_KEYS.CONVERSATIONS);
        if (storedConvs) {
          const parsed = JSON.parse(storedConvs);
          state.conversations = enforceStorageQuotas(parsed);
        } else {
          state.conversations = [];
        }
      } catch (err) {
        console.error("Error cargando localStorage:", err);
        state.tokens = STORAGE_LIMITS.INITIAL_TOKENS;
        state.conversations = [];
      }
      syncActiveConversationForSection();
    }

    function saveTokensToLocal(newTokens) {
      state.tokens = Math.max(0, newTokens);
      try {
        localStorage.setItem(STORAGE_KEYS.TOKENS, String(state.tokens));
      } catch (e) {
        console.error("Error guardando tokens en localStorage:", e);
      }
    }

    function saveConversationsToLocal() {
      state.conversations = enforceStorageQuotas(state.conversations);
      try {
        localStorage.setItem(STORAGE_KEYS.CONVERSATIONS, JSON.stringify(state.conversations));
      } catch (err) {
        // Si el navegador lanza QuotaExceededError, purgamos la mitad más antigua y reintentamos
        console.warn("Almacenamiento lleno. Purgando conversaciones antiguas automáticamente...");
        state.conversations = state.conversations.slice(0, Math.max(2, Math.floor(state.conversations.length / 2)));
        try {
          localStorage.setItem(STORAGE_KEYS.CONVERSATIONS, JSON.stringify(state.conversations));
          showToast("Se han limpiado chats antiguos para liberar memoria en el navegador.");
        } catch (innerErr) {
          console.error("No se pudo guardar en localStorage:", innerErr);
        }
      }
    }

    function syncActiveConversationForSection() {
      const sectionList = state.conversations.filter((c) => c.section === state.activeSection);
      if (sectionList.length > 0) {
        const exists = sectionList.some((c) => c.id === state.activeConvId);
        if (!exists) {
          state.activeConvId = sectionList[0].id;
        }
      } else {
        state.activeConvId = null;
      }
    }

    // ============================================================================
    // 7. INTEGRACIÓN CON GOOGLE ADS (INTERSTICIAL SALTABLE VS REWARDED NO SALTABLE)
    // ============================================================================
    function initGoogleAdsSdk() {
      try {
        if (typeof window.adConfig === "function") {
          window.adConfig({
            preloadAdBreaks: "on",
            sound: "on",
            onReady: () => console.info("Google Ad Placement API lista en KrusseAI.")
          });

      } catch (e) {
        console.warn("Google Ads SDK pendiente de carga:", e);
      }
    }

    // 7.1 Anuncio Intersticial Aleatorio (18% probabilidad - SE PUEDE SALTAR tras 5s)
    function maybeTriggerRandomInterstitialAd() {
      if (state.adOverlay.active || state.outOfTokensModal) return;
      if (Math.random() >= GOOGLE_ADS_CONFIG.interstitialProbability) return;

      // Intentar primero disparar el adBreak nativo de Google AdSense H5
      let handledByGoogleAdBreak = false;
      if (typeof window.adBreak === "function") {
        try {
          window.adBreak({
            type: "next",
            name: "krusse_random_interstitial",
            beforeAd: () => {
              handledByGoogleAdBreak = true;
            },
            adBreakDone: (placementInfo) => {
              // Si Google no sirvió inventario en vivo (ej. dominio en revisión o AdBlock),
              // abrimos el contenedor con el bloque <ins class="adsbygoogle"> y botón "Saltar anuncio"
              if (!handledByGoogleAdBreak || placementInfo?.breakStatus !== "viewed") {
                openGoogleAdContainer("interstitial");
              }
            }
          });
          setTimeout(() => {
            if (!handledByGoogleAdBreak && !state.adOverlay.active) {
              openGoogleAdContainer("interstitial");
            }
          }, 350);
          return;
        } catch (err) {
          console.warn("Fallback al contenedor de Google AdSense:", err);
        }
      }

      openGoogleAdContainer("interstitial");
    }

    // 7.2 Anuncio de Vídeo Recompensado (+10 Tokens - NO SE PUEDE SALTAR, 30s obligatorios)
    function startRewardedVideoAd() {
      state.outOfTokensModal = false;
      let handledByGoogleReward = false;

      if (typeof window.adBreak === "function") {
        try {
          window.adBreak({
            type: "reward",
            name: "krusse_reward_10_tokens",
            beforeReward: (showAdFn) => {
              handledByGoogleReward = true;
              showAdFn();
            },
            adViewed: () => {
              saveTokensToLocal(state.tokens + STORAGE_LIMITS.REWARD_TOKENS);
              showToast(`¡Anuncio verificado! Has recibido +${STORAGE_LIMITS.REWARD_TOKENS} tokens.`);
              renderApp();
            },
            adDismissed: () => {
              showToast("Debes ver el anuncio completo sin cerrarlo para recibir los +10 tokens.", "error");
            },
            adBreakDone: (placementInfo) => {
              if (!handledByGoogleReward || placementInfo?.breakStatus !== "viewed") {
                openGoogleAdContainer("rewarded");
              }
            }
          });
          setTimeout(() => {
            if (!handledByGoogleReward && !state.adOverlay.active) {
              openGoogleAdContainer("rewarded");
            }
          }, 350);
          return;
        } catch (err) {
          console.warn("Fallback al contenedor Rewarded de Google Ads:", err);
        }
      }

      openGoogleAdContainer("rewarded");
    }

    // Contenedor de anuncios conectado a <ins class="adsbygoogle"> con control estricto de salto y duración
    function openGoogleAdContainer(type) {
      if (adTimerInterval) clearInterval(adTimerInterval);
      const isRewarded = type === "rewarded";
      const totalSec = isRewarded
        ? GOOGLE_ADS_CONFIG.rewardedDurationSec
        : GOOGLE_ADS_CONFIG.interstitialTotalSec;

      state.adOverlay = {
        active: true,
        type,
        secondsLeft: totalSec,
        totalSeconds: totalSec,
        skipSecondsLeft: isRewarded ? totalSec : GOOGLE_ADS_CONFIG.interstitialSkipAfterSec,
        canSkip: false,
        completed: false,
        sdkRendered: false
      };

      renderApp();
      mountGoogleAdsenseUnit(type);

      adTimerInterval = setInterval(() => {
        if (!state.adOverlay.active) {
          clearInterval(adTimerInterval);
          return;
        }

        // Reducir tiempo restante general
        if (state.adOverlay.secondsLeft > 0) {
          state.adOverlay.secondsLeft -= 1;
        }

        // En anuncios intersticiales aleatorios, habilitar "Saltar anuncio" tras 5 segundos
        if (!isRewarded && state.adOverlay.skipSecondsLeft > 0) {
          state.adOverlay.skipSecondsLeft -= 1;
          if (state.adOverlay.skipSecondsLeft <= 0) {
            state.adOverlay.canSkip = true;
          }
        }

        // Si el contador llega a 0
        if (state.adOverlay.secondsLeft <= 0) {
          clearInterval(adTimerInterval);
          adTimerInterval = null;
          state.adOverlay.completed = true;
          state.adOverlay.canSkip = true;

          // Solo los anuncios de recompensa otorgan +10 tokens al terminar los 30s íntegros
          if (isRewarded) {
            saveTokensToLocal(state.tokens + STORAGE_LIMITS.REWARD_TOKENS);
            showToast(`¡Recompensa desbloqueada! +${STORAGE_LIMITS.REWARD_TOKENS} tokens añadidos.`);
          }
          renderApp();
          return;
        }

        updateAdOverlayDomLive();
      }, 1000);
    }

    // Inserta e inicializa la etiqueta oficial <ins class="adsbygoogle"> dentro del modal
    function mountGoogleAdsenseUnit(type) {
      requestAnimationFrame(() => {
        const slotContainer = document.getElementById("google-ad-slot-mount");
        if (!slotContainer) return;

        const slotId = type === "rewarded"
          ? GOOGLE_ADS_CONFIG.rewardedSlotId
          : GOOGLE_ADS_CONFIG.interstitialSlotId;

        slotContainer.innerHTML = `
          <ins class="adsbygoogle"
               style="display:block; width:100%; min-height:250px;"
               data-ad-client="${GOOGLE_ADS_CONFIG.publisherId}"
               data-ad-slot="${slotId}"
               data-ad-format="auto"
               data-full-width-responsive="true"></ins>
        `;

        try {
          (window.adsbygoogle = window.adsbygoogle || []).push({});
          state.adOverlay.sdkRendered = true;
        } catch (e) {
          console.debug("AdSense slot inicializado en modo espera de aprobación del dominio.");
        }
      });
    }

    function updateAdOverlayDomLive() {
      const isRewarded = state.adOverlay.type === "rewarded";
      const timerBadge = document.getElementById("ad-timer-countdown");
      const progressBar = document.getElementById("ad-progress-bar");
      const actionArea = document.getElementById("ad-action-controls");

      if (timerBadge) {
        timerBadge.textContent = `${state.adOverlay.secondsLeft}s`;
      }
      if (progressBar) {
        const total = state.adOverlay.totalSeconds || 1;
        const pct = Math.min(100, Math.round(((total - state.adOverlay.secondsLeft) / total) * 100));
        progressBar.style.width = `${pct}%`;
      }
      if (actionArea && !isRewarded) {
        if (state.adOverlay.canSkip) {
          actionArea.innerHTML = `
            <button
              type="button"
              onclick="skipOrCloseAdOverlay()"
              class="w-full py-3.5 px-6 rounded-2xl bg-slate-100 hover:bg-white text-slate-950 font-extrabold text-xs sm:text-sm shadow-xl transition flex items-center justify-center gap-2 cursor-pointer"
            >
              <span>Saltar Anuncio</span>
              <i data-lucide="skip-forward" class="w-4 h-4"></i>
            </button>
          `;
          if (window.lucide) window.lucide.createIcons();
        } else {
          const skipLabel = document.getElementById("ad-skip-countdown-text");
          if (skipLabel) {
            skipLabel.textContent = `Puedes saltar este anuncio en ${state.adOverlay.skipSecondsLeft}s...`;
          }
        }
      }
    }

    // Cerrar o saltar anuncio (bloqueado en 'rewarded' hasta que termine el contador de 30s)
    window.skipOrCloseAdOverlay = function () {
      const isRewarded = state.adOverlay.type === "rewarded";
      if (isRewarded && !state.adOverlay.completed) {
        showToast("Los anuncios de recompensa (+10 tokens) no se pueden saltar.", "error");
        return;
      }
      if (!isRewarded && !state.adOverlay.canSkip && !state.adOverlay.completed) {
        return;
      }
      if (adTimerInterval) {
        clearInterval(adTimerInterval);
        adTimerInterval = null;
      }
      state.adOverlay = {
        active: false,
        type: null,
        secondsLeft: 0,
        totalSeconds: 0,
        skipSecondsLeft: 0,
        canSkip: false,
        completed: false,
        sdkRendered: false
      };
      renderApp();
    };

    // ============================================================================
    // 8. CONEXIÓN SEGURA CON EL PROXY BACKEND O RESPUESTA INTELIGENTE LOCAL
    // ============================================================================
    async function requestKrusseAIResponse(messagesHistory, sectionKey) {
      const section = SECTIONS[sectionKey];
      const recentMessages = messagesHistory.slice(-AI_CONNECTION_CONFIG.maxContextMessages);

      // Inyectamos silenciosamente la directiva de especialización en el último mensaje
      const formattedContents = recentMessages.map((msg, idx) => {
        const isLastUser = idx === recentMessages.length - 1 && msg.role === "user";
        const contentText = isLastUser
          ? `${section.hiddenDirective}\n\nConsulta del usuario: ${msg.content}`
          : msg.content;
        return {
          role: msg.role === "assistant" ? "model" : "user",
          parts: [{ text: contentText }]
        };
      });

      const payload = {
        mode: sectionKey,
        model: AI_CONNECTION_CONFIG.model,
        systemInstruction: {
          parts: [{ text: section.systemPrompt }]
        },
        contents: formattedContents
      };

      const endpoint = (AI_CONNECTION_CONFIG.proxyEndpoint || "").trim();

      // Si el propietario ha configurado su Proxy Backend seguro, enviamos la petición allí
      if (endpoint) {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let errorData = {};
        try {
          errorData = await response.json();
        } catch (e) {}

        if (!response.ok) {
          throw new Error(errorData.error || `El servidor Proxy devolvió un código ${response.status}`);
        }

        const data = errorData;
        const extractedText =
          data.reply ||
          data.text ||
          data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!extractedText) {
          throw new Error("El Proxy respondió sin contenido de texto.");
        }
        return extractedText;
      }

      // Si aún no se ha conectado una URL en `proxyEndpoint`, ofrecemos una respuesta
      // demostrativa enriquecida en Markdown del modo correspondiente para probar la UI
      await new Promise((r) => setTimeout(r, 750));
      const lastUserQuestion = recentMessages[recentMessages.length - 1]?.content || "";
      return generateBuiltInMarkdownDemo(sectionKey, lastUserQuestion);
    }

        return `### Estudio de Producción KrusseAI — Modo Música\n\nPropuesta musical y técnica para **"${query}"**:\n\n| Compás | Acorde (Cifrado) | Grado Armónico | Sensación Sonora |\n| :---: | :---: | :---: | :--- |\n| 1 | **Fmaj7** | IVmaj7 | Nostálgico / Abierto |\n| 2 | **Em7** | iii7 | Melancólico / Suave |\n| 3 | **Dm9** | ii9 | Profundo / Neo-Soul |\n| 4 | **C9sus4 → Cmaj7** | V9sus4 → Imaj7 | Resolución cálida |\n\n* **Cadena de Mezcla Recomendada:** Filtro paso alto (HPF) a \`85 Hz\`, compresión óptica suave (\`3:1\`, reducción de \`-3 dB\`) y reverb tipo *Plate* con pre-delay de \`25 ms\`.`;

    function handleEnterWorkspace() {

        state.showLanding = false;

    function handleSelectSection(sectionKey) {
      if (!SECTIONS[sectionKey] || state.activeSection === sectionKey) return;
      state.activeSection = sectionKey;
      state.mobileMenuOpen = false;
      syncActiveConversationForSection();
      renderApp();
      maybeTriggerRandomInterstitialAd();

    function handleNewConversation() {
      const sec = SECTIONS[state.activeSection];
      const newConv = {
        id: "conv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        title: `Nueva sesión de ${sec.shortName}`,
        section: state.activeSection,
        updatedAt: Date.now(),
        messages: [
          {
            id: "msg_" + Date.now(),

          }

      state.conversations.unshift(newConv);

    function handleDeleteConversation(convId, event) {
      if (event) event.stopPropagation();
      state.conversations = state.conversations.filter((c) => c.id !== convId);
      saveConversationsToLocal();
      syncActiveConversationForSection();
      renderApp();
      showToast("Conversación eliminada de la memoria local.");
    }

    function handleClearSectionConversations() {
      state.conversations = state.conversations.filter((c) => c.section !== state.activeSection);
      saveConversationsToLocal();
      syncActiveConversationForSection();
      state.storageManagerModal = false;
      renderApp();
      showToast(`Se han vaciado los chats de ${SECTIONS[state.activeSection].shortName}.`);
    }

    function handleClearAllLocalStorageChats() {
      state.conversations = [];
      state.activeConvId = null;
      saveConversationsToLocal();
      state.storageManagerModal = false;
      renderApp();
      showToast("Todo el historial local ha sido limpiado.");
    }

    async function handleSendMessage(presetQuestion = null) {
      if (state.isGenerating) return;
      const inputEl = document.getElementById("chat-input-box");
      const rawText = presetQuestion !== null ? presetQuestion : (inputEl ? inputEl.value : state.inputMessage);
      const textToSend = String(rawText || "").trim();
      if (!textToSend) return;

      // Si el usuario tiene 0 tokens, bloquear envío y abrir el modal de vídeo recompensado
      if (state.tokens <= 0) {
        state.outOfTokensModal = true;
        renderApp();
        return;
      }

      // Descontar 1 token en localStorage
      saveTokensToLocal(state.tokens - 1);
      state.inputMessage = "";
      state.isGenerating = true;

      const userMsg = {
        id: "msg_" + Date.now() + "_u",
        role: "user",
        content: textToSend,
        timestamp: Date.now()
      };

      let targetConv = state.conversations.find(
        (c) => c.id === state.activeConvId && c.section === state.activeSection
      );

      if (!targetConv) {
        targetConv = {
          id: "conv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
          title: textToSend.slice(0, 42) + (textToSend.length > 42 ? "..." : ""),
          section: state.activeSection,
          updatedAt: Date.now(),
          messages: [userMsg]
        };
        state.conversations.unshift(targetConv);
        state.activeConvId = targetConv.id;
      } else {
        targetConv.messages.push(userMsg);
        if (targetConv.messages.length <= 2) {
          targetConv.title = textToSend.slice(0, 42) + (textToSend.length > 42 ? "..." : "");
        }
        targetConv.updatedAt = Date.now();
      }

      saveConversationsToLocal();
      renderApp();
      scrollToBottom();

      try {
        const aiReply = await requestKrusseAIResponse(targetConv.messages, state.activeSection);
        targetConv.messages.push({
          id: "msg_" + Date.now() + "_a",
          role: "assistant",
          content: aiReply,
          timestamp: Date.now()
        });
        targetConv.updatedAt = Date.now();
        saveConversationsToLocal();
      } catch (err) {
        targetConv.messages.push({
          id: "msg_" + Date.now() + "_err",
          role: "assistant",
          content: `⚠️ **Error al conectar con el Proxy de KrusseAI:** ${err.message}\n\nVerifica que la URL configurada en \`AI_CONNECTION_CONFIG.proxyEndpoint\` esté activa y respondiendo en formato JSON.`,
          timestamp: Date.now()
        });
        saveConversationsToLocal();
      } finally {
        state.isGenerating = false;
        renderApp();
        scrollToBottom();
        maybeTriggerRandomInterstitialAd();
      }
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        const container = document.getElementById("messages-scroll-container");
        if (container) {
          container.scrollTop = container.scrollHeight;
        }
      });
    }

    function renderWorkspaceView() {
      const currentSec = SECTIONS[state.activeSection];
      const sectionConversations = state.conversations.filter((c) => c.section === state.activeSection);
      const activeConv = sectionConversations.find((c) => c.id === state.activeConvId);

      const modeButtonsHtml = Object.values(SECTIONS)
        .map((sec) => {
          const isActive = sec.id === state.activeSection;
          return `
            <button
              type="button"
              onclick="handleSelectSection('${sec.id}')"
              class="flex items-center gap-1.5 px-2.5 sm:px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                isActive
                  ? `bg-gradient-to-r ${sec.theme.gradient} text-white shadow-md`
                  : "text-slate-400 hover:text-slate-200"
              }"
            >
              <i data-lucide="${sec.icon}" class="w-3.5 h-3.5 shrink-0"></i>
              <span>${sec.shortName}</span>
            </button>
          `;
        })
        .join("");

      const sidebarChatsHtml =
        sectionConversations.length === 0
          ? `
            <div class="text-center py-10 px-4">
              <i data-lucide="message-square" class="w-7 h-7 text-slate-600 mx-auto mb-2"></i>
              <p class="text-xs text-slate-400">No hay chats guardados en <strong>${currentSec.shortName}</strong>.</p>
            </div>
          `
          : sectionConversations
              .map((conv) => {
                const isSelected = conv.id === state.activeConvId;
                const safeTitle = String(conv.title || "Conversación").replace(/</g, "&lt;");
                return `
                  <div
                    onclick="selectConversation('${conv.id}')"
                    class="group flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer text-xs transition ${
                      isSelected
                        ? `${currentSec.theme.bgSoft} ${currentSec.theme.text} border ${currentSec.theme.border}`
                        : "text-slate-300 hover:bg-slate-800/70"
                    }"
                  >
                    <div class="flex items-center gap-2 overflow-hidden">
                      <i data-lucide="message-square" class="w-3.5 h-3.5 shrink-0 opacity-75"></i>
                      <span class="truncate font-medium">${safeTitle}</span>
                    </div>
                    <button
                      type="button"
                      onclick="handleDeleteConversation('${conv.id}', event)"
                      title="Eliminar conversación"
                      class="opacity-70 group-hover:opacity-100 p-1 hover:text-red-400 transition"

              .join("");

      let messagesAreaHtml = "";

          .map((sug) => {

            return `

              </button>

        messagesAreaHtml = `
          <div class="max-w-2xl mx-auto my-6 text-center">

        messagesAreaHtml = activeConv.messages
          .map((msg) => {
            const isUser = msg.role === "user";
            const bodyHtml = isUser
              ? `<div class="text-sm whitespace-pre-wrap break-words">${String(msg.content).replace(/</g, "&lt;")}</div>`

            return `
              <div class="flex gap-3 max-w-3xl ${isUser ? "ml-auto flex-row-reverse" : "mr-auto"}">

      const generatingIndicatorHtml = state.isGenerating

              <div class="flex items-center gap-2.5">

            <!-- Selector de los 4 Modos -->
            <nav class="flex items-center bg-slate-950/90 p-1 rounded-2xl border border-white/10 overflow-x-auto max-w-full shadow-inner">

            <!-- Contador Local de Tokens + Botón de recarga con Vídeo Recompensado -->
            <div class="flex items-center gap-2">
              <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-white/10 text-xs font-bold shadow-inner">
                <i data-lucide="coins" class="w-4 h-4 text-amber-400"></i>
                <span class="${state.tokens === 0 ? "text-red-400" : "text-amber-300"}">${state.tokens}</span>
                <span class="hidden md:inline text-slate-400 font-normal">Tokens</span>
              </div>

              <button
                type="button"
                onclick="startRewardedVideoAd()"
                title="Ver anuncio completo (sin saltar) para ganar +10 tokens gratis"
                class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-extrabold text-xs shadow-lg transition transform active:scale-95"
              >
                <i data-lucide="play-circle" class="w-4 h-4"></i>
                <span class="hidden sm:inline">+10 Tokens</span>
              </button>
            </div>
          </header>

          <!-- Cuerpo Principal -->
          <div class="flex-1 flex overflow-hidden relative">
            <!-- Sidebar de Conversaciones en localStorage -->
            <aside class="${
              state.mobileMenuOpen ? "translate-x-0" : "-translate-x-full lg:translate-x-0"
            } fixed lg:static inset-y-0 left-0 z-30 w-72 glass-panel border-r border-white/10 flex flex-col transition-transform duration-200 ease-in-out">
              <div class="p-3.5 border-b border-white/10">
                <button
                  type="button"
                  onclick="handleNewConversation()"
                  class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r ${currentSec.theme.gradient} hover:brightness-110 text-white font-bold text-xs shadow-lg flex items-center justify-center gap-2 transition"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Nuevo chat en ${currentSec.shortName}</span>
                </button>
              </div>

              <div class="px-3.5 pt-3 pb-1 flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                <span>Historial • ${currentSec.shortName}</span>
                <span>${sectionConversations.length}/${STORAGE_LIMITS.MAX_CHATS_PER_SECTION}</span>
              </div>

              <div class="flex-1 overflow-y-auto p-3 space-y-1.5">
                ${sidebarChatsHtml}
              </div>

              <!-- Bloque de recarga por anuncio y gestión de memoria local -->
              <div class="p-3 border-t border-slate-800 bg-slate-950/60 space-y-2">
                <button
                  type="button"
                  onclick="startRewardedVideoAd()"
                  class="w-full py-2 px-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-300 text-xs font-semibold flex items-center justify-center gap-2 transition"
                >
                  <i data-lucide="tv" class="w-4 h-4"></i>
                  <span>Ver Anuncio (+10 Tokens)</span>
                </button>

                <div class="flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onclick="openStorageManagerModal()"
                    class="flex-1 py-1.5 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium flex items-center justify-center gap-1.5 transition"
                  >
                    <i data-lucide="hard-drive" class="w-3.5 h-3.5"></i>
                    <span>Memoria Local</span>
                  </button>

                  <button
                    type="button"
                    onclick="backToLanding()"
                    class="py-1.5 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium flex items-center justify-center gap-1 transition"
                    title="Volver a la portada"
                  >
                    <i data-lucide="home" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            </aside>

            <!-- Zona central de mensajes -->
            <main class="flex-1 flex flex-col bg-transparent overflow-hidden">
              <!-- Subcabecera del modo activo -->
              <div class="px-4 sm:px-6 py-2.5 glass-panel border-b border-white/10 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2.5">
                  <div class="p-2 rounded-xl ${currentSec.theme.bgSoft} ${currentSec.theme.text} border ${currentSec.theme.border}">
                    <i data-lucide="${currentSec.icon}" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h2 class="text-xs sm:text-sm font-bold text-white">${currentSec.name}</h2>
                    <p class="text-[11px] text-slate-400 hidden sm:block">${currentSec.description}</p>
                  </div>

                <span class="text-[11px] px-2.5 py-1 rounded-lg bg-slate-900/90 border border-white/10 text-slate-300 hidden md:inline-flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>Especialista ${currentSec.shortName} Activo</span>
                </span>
              </div>

              <!-- Contenedor scrollable de mensajes -->
              <div id="messages-scroll-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                ${messagesAreaHtml}
                ${generatingIndicatorHtml}
              </div>

              <!-- Barra inferior de entrada de texto -->
              <div class="p-3 sm:p-4 glass-panel border-t border-white/10 shrink-0">
                <form onsubmit="event.preventDefault(); handleSendMessage();" class="max-w-3xl mx-auto flex items-center gap-2.5">
                  <input
                    id="chat-input-box"
                    type="text"
                    value="${String(state.inputMessage || "").replace(/"/g, "&quot;")}"
                    oninput="state.inputMessage = this.value"
                    ${state.isGenerating ? "disabled" : ""}
                    placeholder="${
                      state.tokens > 0
                        ? `Pregunta a KrusseAI en modo ${currentSec.shortName} (1 token por mensaje)...`
                        : "Te has quedado sin tokens. Pulsa en '+10 Tokens' para recargar gratis..."
                    }"
                    class="flex-1 px-4 py-3.5 rounded-2xl bg-slate-950/90 border border-white/10 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500/60 shadow-inner"
                  />
                  <button
                    type="submit"
                    ${state.isGenerating ? "disabled" : ""}
                    class="px-5 py-3.5 rounded-2xl font-bold text-xs sm:text-sm text-white flex items-center gap-2 transition shadow-lg disabled:opacity-40 bg-gradient-to-r ${currentSec.theme.gradient} hover:brightness-110"
                  >
                    <span class="hidden sm:inline">Enviar</span>
                    <i data-lucide="send" class="w-4 h-4"></i>
                  </button>
                </form>
              </div>
            </main>
          </div>
        </div>
      `;

    // Modal cuando el contador llega a 0 tokens
    function renderOutOfTokensModal() {
      if (!state.outOfTokensModal) return "";
      return `
        <div class="fixed inset-0 z-[90] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div class="glass-card border border-amber-500/40 rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl text-center">
            <div class="w-16 h-16 rounded-3xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center mx-auto mb-4 text-amber-400 shadow-lg">

            </div>
            <h3 class="text-xl font-extrabold text-white mb-2">Te has quedado sin tokens</h3>

            <div class="flex flex-col sm:flex-row gap-2.5">
              <button
                type="button"
                onclick="closeOutOfTokensModal()"

              >
                Ahora no
              </button>
              <button
                type="button"
                onclick="startRewardedVideoAd()"
                class="sm:flex-[2] py-3 px-5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg flex items-center justify-center gap-2 transition"
              >
                <i data-lucide="play-circle" class="w-5 h-5"></i>
                <span>Ver Anuncio (+10 Tokens)</span>

      `;

    // Modal de control de memoria de localStorage
    function renderStorageManagerModal() {
      if (!state.storageManagerModal) return "";
      const usedBytes = getStorageUsageBytes();
      const usedKb = (usedBytes / 1024).toFixed(1);
      const maxKb = (STORAGE_LIMITS.MAX_STORAGE_BYTES / 1024).toFixed(0);
      const pct = Math.min(100, Math.round((usedBytes / STORAGE_LIMITS.MAX_STORAGE_BYTES) * 100));

      return `
        <div class="fixed inset-0 z-[90] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
              <div class="flex items-center gap-2">
                <i data-lucide="hard-drive" class="w-5 h-5 text-blue-400"></i>
                <h3 class="text-base font-bold text-white">Gestión de Memoria (localStorage)</h3>
              </div>
              <button type="button" onclick="closeStorageManagerModal()" class="text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="my-4 space-y-3 text-xs text-slate-300">
              <div class="p-3.5 rounded-2xl bg-slate-950/90 border border-white/10">
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-slate-400">Espacio utilizado por chats:</span>
                  <span class="font-mono font-bold text-white">${usedKb} KB / ${maxKb} KB (${pct}%)</span>
                </div>
                <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-emerald-500 to-blue-500" style="width: ${pct}%"></div>
                </div>
              </div>

              <p class="text-slate-400 leading-relaxed">
                KrusseAI limita automáticamente el historial a <strong>${STORAGE_LIMITS.MAX_CHATS_PER_SECTION} conversaciones por modo</strong> y <strong>${STORAGE_LIMITS.MAX_MESSAGES_PER_CHAT} mensajes por sesión</strong> para que el navegador siempre funcione rápido.
              </p>
            </div>

            <div class="space-y-2 pt-2 border-t border-slate-800">
              <button
                type="button"
                onclick="handleClearSectionConversations()"
                class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs transition flex items-center justify-center gap-2"
              >
                <i data-lucide="trash-2" class="w-4 h-4 text-amber-400"></i>
                <span>Vaciar solo chats de ${SECTIONS[state.activeSection].shortName}</span>
              </button>

              <button
                type="button"
                onclick="handleClearAllLocalStorageChats()"
                class="w-full py-2.5 px-4 rounded-xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/30 text-red-300 font-semibold text-xs transition flex items-center justify-center gap-2"
              >
                <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                <span>Borrar todo el historial de todos los modos</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Pantalla completa de Google Ads:
    // - Intersticial aleatorio (15s total, SE PUEDE SALTAR tras 5s)
    // - Recompensado por +10 tokens (30s total, NO SE PUEDE SALTAR hasta terminar)
    function renderFullscreenAdOverlay() {
      if (!state.adOverlay.active) return "";
      const isRewarded = state.adOverlay.type === "rewarded";
      const totalSec = state.adOverlay.totalSeconds || (isRewarded ? GOOGLE_ADS_CONFIG.rewardedDurationSec : GOOGLE_ADS_CONFIG.interstitialTotalSec);
      const elapsedPct = Math.min(100, Math.round(((totalSec - state.adOverlay.secondsLeft) / totalSec) * 100));

      let bottomControlsHtml = "";
      if (isRewarded) {
        // Anuncio Recompensado (+10 Tokens): NO SE PUEDE SALTAR hasta llegar a 0s
        bottomControlsHtml = `
          <button
            type="button"
            onclick="skipOrCloseAdOverlay()"
            ${!state.adOverlay.completed ? "disabled" : ""}
            class="w-full py-3.5 px-6 rounded-2xl font-extrabold text-xs sm:text-sm transition flex items-center justify-center gap-2 ${
              state.adOverlay.completed
                ? "bg-gradient-to-r from-emerald-500 to-teal-500 hover:brightness-110 text-slate-950 shadow-xl cursor-pointer"
                : "bg-slate-800/90 text-slate-400 border border-white/5 cursor-not-allowed"
            }"
          >
            <i data-lucide="${state.adOverlay.completed ? "check-circle-2" : "lock"}" class="w-4 h-4"></i>
            <span>
              ${
                state.adOverlay.completed
                  ? "¡Reclamar +10 Tokens y Volver al Chat!"
                  : `Anuncio de recompensa sin salto (${state.adOverlay.secondsLeft}s restantes)...`
              }
            </span>
          </button>
        `;
      } else {
        // Anuncio Intersticial Aleatorio: SE PUEDE SALTAR tras 5 segundos
        bottomControlsHtml = state.adOverlay.canSkip
          ? `
            <button
              type="button"
              onclick="skipOrCloseAdOverlay()"
              class="w-full py-3.5 px-6 rounded-2xl bg-slate-100 hover:bg-white text-slate-950 font-extrabold text-xs sm:text-sm shadow-xl transition flex items-center justify-center gap-2 cursor-pointer"
            >
              <span>Saltar Anuncio</span>
              <i data-lucide="skip-forward" class="w-4 h-4"></i>
            </button>
          `
          : `
            <div class="w-full py-3.5 px-6 rounded-2xl bg-slate-900 border border-white/10 text-slate-300 font-semibold text-xs sm:text-sm flex items-center justify-center gap-2">
              <i data-lucide="clock" class="w-4 h-4 text-blue-400 animate-spin"></i>
              <span id="ad-skip-countdown-text">Puedes saltar este anuncio en ${state.adOverlay.skipSecondsLeft}s...</span>
            </div>
          `;
      }

      return `
        <div class="fixed inset-0 z-[110] bg-slate-950/95 backdrop-blur-2xl flex flex-col items-center justify-center p-4 sm:p-6 text-center">
          <div class="max-w-xl w-full glass-card rounded-3xl p-6 sm:p-7 shadow-2xl relative overflow-hidden">
            <!-- Barra de progreso superior del anuncio -->
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-5">
              <div id="ad-progress-bar" class="h-full bg-gradient-to-r from-amber-400 via-emerald-400 to-blue-500 transition-all duration-500" style="width: ${elapsedPct}%"></div>
            </div>

            <!-- Cabecera informativa del tipo de anuncio -->
            <div class="flex items-center justify-between text-xs mb-4 gap-2">
              <span class="px-3 py-1 rounded-full ${
                isRewarded
                  ? "bg-amber-500/20 text-amber-300 border border-amber-500/30"
                  : "bg-blue-500/20 text-blue-300 border border-blue-500/30"
              } font-bold uppercase tracking-wider text-[11px] flex items-center gap-1.5">
                <i data-lucide="${isRewarded ? "award" : "tv"}" class="w-3.5 h-3.5"></i>
                <span>${isRewarded ? "Google Ads • Recompensa (+10 Tokens • Sin Salto)" : "Google Ads • Intersticial (Saltable)"}</span>
              </span>

              <span id="ad-timer-countdown" class="font-mono font-bold text-slate-200 bg-slate-950/90 px-3 py-1 rounded-lg border border-white/10">
                ${state.adOverlay.completed ? "0s" : `${state.adOverlay.secondsLeft}s`}
              </span>
            </div>

            <!-- Contenedor Oficial donde Google AdSense / GPT inyecta el anuncio real -->
            <div class="rounded-2xl bg-slate-950/95 border border-white/10 mb-5 overflow-hidden relative min-h-[260px] flex flex-col items-center justify-center p-4">
              <!-- Etiqueta oficial <ins class="adsbygoogle"> montada dinámicamente -->
              <div id="google-ad-slot-mount" class="w-full flex items-center justify-center z-10"></div>

              <!-- Respaldo visual inferior mientras Google AdSense carga el creativo en el slot -->
              <div class="text-center pointer-events-none mt-2">
                <span class="inline-block text-[10px] uppercase tracking-widest text-slate-500 font-semibold mb-1">
                  Espacio Publicitario Google AdSense (${GOOGLE_ADS_CONFIG.publisherId})
                </span>
                <p class="text-xs text-slate-400 max-w-md mx-auto">
                  ${
                    isRewarded
                      ? `Visualización completa de ${GOOGLE_ADS_CONFIG.rewardedDurationSec} segundos requerida para desbloquear +10 tokens.`
                      : `Anuncio aleatorio breve. Puedes saltarlo tras ${GOOGLE_ADS_CONFIG.interstitialSkipAfterSec} segundos.`
                  }
                </p>
              </div>
            </div>

            <!-- Botón de Saltar (para intersticiales tras 5s) o Reclamar Recompensa (tras 30s sin salto) -->
            <div id="ad-action-controls">
              ${bottomControlsHtml}
            </div>
          </div>
        </div>
      `;
    }

    // Funciones auxiliares de navegación y modales
    window.toggleMobileMenu = function () {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      renderApp();
    };

    window.selectConversation = function (convId) {
      state.activeConvId = convId;
      state.mobileMenuOpen = false;
      renderApp();
      scrollToBottom();
    };

    window.closeOutOfTokensModal = function () {
      state.outOfTokensModal = false;
      renderApp();
    };

    window.openStorageManagerModal = function () {
      state.storageManagerModal = true;
      state.mobileMenuOpen = false;
      renderApp();
    };

    window.closeStorageManagerModal = function () {
      state.storageManagerModal = false;
      renderApp();
    };

    window.backToLanding = function () {
      state.showLanding = true;
      state.mobileMenuOpen = false;
      renderApp();
    };

    function renderApp() {
      const root = document.getElementById("app-root");
      if (!root) return;

      const mainView = state.showLanding ? renderLandingView() : renderWorkspaceView();
      root.innerHTML = `
        ${mainView}
        ${renderOutOfTokensModal()}
        ${renderStorageManagerModal()}
        ${renderFullscreenAdOverlay()}
      `;

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    // Inicialización al cargar la ventana
    window.addEventListener("DOMContentLoaded", () => {
      configureMarkdownEngine();
      initGoogleAdsSdk();
      loadLocalData();
      renderApp();
    });
  </script>
</body>
</html>
